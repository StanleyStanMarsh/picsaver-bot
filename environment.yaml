name: picsaver
channels:
  - defaults
dependencies:
  - python=3.11
  - jupyter
  - transformers
  - pillow
  - qdrant-client
  - pytorch::torchvision
  - pytorch::pytorch
  - conda-forge::timm
  - einops
  - python-dotenv
  - conda-forge::rq
  - loguru
  - tenacity
  - pip:
    - asyncpg
    - "sqlalchemy[asyncio]"
    - greenlet
    - aiogram
    - aiohttp-socks
prefix: /opt/homebrew/anaconda3/envs/picsaver