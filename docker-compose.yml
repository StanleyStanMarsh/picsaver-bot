services:
  redis:
    image: redis:7-alpine
    container_name: bot-redis
    restart: unless-stopped
    mem_limit: 256m
    volumes:
      - redis-data:/data
    networks:
      - bot-network

  postgres:
    image: postgres:16-alpine
    container_name: bot-postgres
    restart: unless-stopped
    mem_limit: 768m
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 20
    networks:
      - bot-network

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: bot-qdrant
    restart: unless-stopped
    mem_limit: 768m
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - bot-network

  migrate:
    build:
      context: .
      dockerfile: migrate.Dockerfile
    image: picsaver-migrate:local
    platform: linux/amd64
    container_name: bot-migrate
    restart: "no"
    env_file:
      - .env
    environment:
      QUEUE_ADDRESS: redis
      QUEUE_PORT: "6379"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bot-network

  save-worker:
    build:
      context: .
      dockerfile: save-worker.Dockerfile
    image: picsaver-save-worker:local
    platform: linux/amd64
    container_name: bot-save-worker
    restart: unless-stopped
    mem_limit: 9216m
    environment:
      QUEUE_ADDRESS: redis
      QUEUE_PORT: "6379"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: user_images
      CLIP_MODEL_NAME: jinaai/jina-clip-v2
      CLIP_VECTOR_SIZE: "1024"
      CLIP_DEVICE: cpu
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      MKL_THREADING_LAYER: GNU
      KMP_DUPLICATE_LIB_OK: "TRUE"
      CLIP_WARMUP: "1"
      HF_HOME: /workspace/.cache/huggingface
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_BUCKET: ${MINIO_BUCKET:-picsaver}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-picsaver}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change_me_minio_password}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
    env_file:
      - .env
    volumes:
      - images-data:/workspace/images
      - hf-cache:/workspace/.cache/huggingface
    depends_on:
      - redis
      - postgres
      - qdrant
      - migrate
      - minio
      - minio-init
    networks:
      - bot-network

  bot:
    build:
      context: .
      dockerfile: bot.Dockerfile
    platform: linux/amd64
    image: picsaver-bot:local
    container_name: bot-main
    restart: unless-stopped
    mem_limit: 512m
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      QUEUE_ADDRESS: redis
      QUEUE_PORT: "6379"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: user_images
      CLIP_VECTOR_SIZE: "1024"
      WEBAPP_URL: ${WEBAPP_URL:-}
      SEARCH_MIN_SCORE: ${SEARCH_MIN_SCORE:-0.25}
      SIMILAR_MIN_SCORE: ${SIMILAR_MIN_SCORE:-0.35}
      SAVE_ALBUM_MAX: ${SAVE_ALBUM_MAX:-5}
      SAVE_RATE_LIMIT: ${SAVE_RATE_LIMIT:-20}
      SAVE_RATE_WINDOW_SEC: ${SAVE_RATE_WINDOW_SEC:-600}
      SAVE_JOB_TIMEOUT: ${SAVE_JOB_TIMEOUT:-600}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_BUCKET: ${MINIO_BUCKET:-picsaver}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-picsaver}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change_me_minio_password}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
    env_file:
      - .env
    volumes:
      - images-data:/workspace/images
    depends_on:
      - redis
      - save-worker
      - postgres
      - qdrant
      - migrate
      - webapp
      - minio
      - minio-init
    networks:
      - bot-network

  # Telegram Mini App (gallery + delete). Public HTTPS via nginx → webapp:8080
  webapp:
    build:
      context: .
      dockerfile: webapp.Dockerfile
    image: picsaver-webapp:local
    platform: linux/amd64
    container_name: bot-webapp
    restart: unless-stopped
    mem_limit: 256m
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: user_images
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_BUCKET: ${MINIO_BUCKET:-picsaver}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-picsaver}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change_me_minio_password}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
    env_file:
      - .env
    volumes:
      - images-data:/workspace/images
    depends_on:
      - postgres
      - qdrant
      - migrate
      - minio
      - minio-init
    networks:
      - bot-network
    # DevOps: nginx TLS terminates here, e.g. proxy_pass http://webapp:8080;
    # expose only if debugging without nginx:
    # ports:
    #   - "8080:8080"

  # Object storage (S3-compatible). Internal only — no public ports.
  # Official minio/minio left Docker Hub (2025/2026); use Chainguard build.
  # Dual-mode: STORAGE_BACKEND=local|minio (app code on this branch).
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: bot-minio
    restart: unless-stopped
    mem_limit: 512m
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-picsaver}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me_minio_password}
    volumes:
      - minio-data:/data
    networks:
      - bot-network
    # Debug console (do not publish on public VPS):
    # ports:
    #   - "127.0.0.1:9000:9000"
    #   - "127.0.0.1:9001:9001"

  minio-init:
    image: python:3.11-slim
    container_name: bot-minio-init
    restart: "no"
    depends_on:
      - minio
    environment:
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_BUCKET: ${MINIO_BUCKET:-picsaver}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-picsaver}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change_me_minio_password}
    volumes:
      - ./scripts/minio_ensure_bucket.py:/ensure_bucket.py:ro
    entrypoint: ["/bin/sh","-c"]
    command:
      - pip install -q "minio>=7.2" && python /ensure_bucket.py
    networks:
      - bot-network


volumes:
  redis-data:
  images-data:
  pg-data:
  qdrant-data:
  hf-cache:
  minio-data:

networks:
  bot-network:
    driver: bridge
